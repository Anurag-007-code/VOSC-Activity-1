<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, neon-styled Tic-Tac-Toe web game featuring 2-Player mode, unbeatable Minimax AI, responsive design, synthesized audio effects, and celebration animations.">
  <title>Tic-Tac-Toe Neo | Modern Web Game</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Glow & Particles -->
  <div class="ambient-glow ambient-top-left" aria-hidden="true"></div>
  <div class="ambient-glow ambient-bottom-right" aria-hidden="true"></div>

  <!-- Confetti Canvas for Celebrations -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header class="game-header">
      <div class="brand">
        <div class="logo-icon" aria-hidden="true">
          <span class="mark-x">✕</span>
          <span class="mark-o">◯</span>
        </div>
        <div class="brand-text">
          <h1 class="game-title">TIC-TAC-TOE <span class="badge-neo">NEO</span></h1>
          <p class="game-subtitle">Classic game with a cyberpunk neon twist</p>
        </div>
      </div>
      
      <!-- Quick Controls (Audio & Restart) -->
      <div class="header-controls">
        <button id="sound-btn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <svg id="sound-on-icon" class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"></path>
          </svg>
          <svg id="sound-off-icon" class="svg-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Game Mode Switcher & Difficulty -->
    <section class="controls-panel" aria-label="Game Mode and Difficulty Settings">
      <div class="mode-selector" role="radiogroup" aria-label="Game Mode">
        <button type="button" id="mode-pvp" class="mode-tab active" data-mode="pvp" role="radio" aria-checked="true">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>2 Players</span>
        </button>
        <button type="button" id="mode-ai" class="mode-tab" data-mode="ai" role="radio" aria-checked="false">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8" y2="16"></line>
            <line x1="16" y1="16" x2="16" y2="16"></line>
          </svg>
          <span>Vs Computer</span>
        </button>
      </div>

      <!-- AI Difficulty Level (visible when AI mode selected) -->
      <div id="ai-difficulty-container" class="difficulty-container hidden">
        <label for="ai-difficulty" class="difficulty-label">AI Level:</label>
        <div class="difficulty-pills" id="ai-difficulty-pills">
          <button type="button" class="diff-pill" data-diff="easy">Easy</button>
          <button type="button" class="diff-pill" data-diff="medium">Medium</button>
          <button type="button" class="diff-pill active" data-diff="hard">Unbeatable</button>
        </div>
      </div>
    </section>

    <!-- Scoreboard -->
    <section class="scoreboard" aria-label="Score Board">
      <div class="score-card card-x" id="score-card-x">
        <div class="score-header">
          <span class="player-symbol mark-x">✕</span>
          <span class="player-name" id="name-player-x">PLAYER X</span>
        </div>
        <div class="score-value" id="score-x">0</div>
      </div>

      <div class="score-card card-tie">
        <div class="score-header">
          <span class="tie-symbol">＝</span>
          <span class="player-name">TIES</span>
        </div>
        <div class="score-value" id="score-ties">0</div>
      </div>

      <div class="score-card card-o" id="score-card-o">
        <div class="score-header">
          <span class="player-symbol mark-o">◯</span>
          <span class="player-name" id="name-player-o">PLAYER O</span>
        </div>
        <div class="score-value" id="score-o">0</div>
      </div>
    </section>

    <!-- Turn Indicator -->
    <div class="turn-banner" id="turn-banner" aria-live="polite">
      <span class="turn-dot" id="turn-dot"></span>
      <span class="turn-text" id="turn-text"><strong class="mark-x">X</strong>'s Turn</span>
    </div>

    <!-- Main Game Board -->
    <main class="board-wrapper">
      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe Game Grid">
        <!-- 9 Grid Cells -->
        <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1" id="cell-0"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2" id="cell-1"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Cell 3" id="cell-2"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="Cell 4" id="cell-3"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="Cell 5" id="cell-4"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="Cell 6" id="cell-5"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="Cell 7" id="cell-6"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="Cell 8" id="cell-7"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="Cell 9" id="cell-8"></button>

        <!-- Dynamic Winning Strike Line -->
        <div class="strike-line hidden" id="strike-line" aria-hidden="true"></div>
      </div>
    </main>

    <!-- Game Actions Footer -->
    <footer class="action-footer">
      <button id="reset-board-btn" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>New Round</span>
      </button>

      <button id="reset-scores-btn" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
        <span>Reset Scores</span>
      </button>
    </footer>

    <!-- Result Modal Overlay -->
    <div class="modal-overlay hidden" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <div class="modal-icon-badge" id="modal-icon-badge">🏆</div>
        <h2 class="modal-title" id="modal-title">PLAYER X WINS!</h2>
        <p class="modal-subtitle" id="modal-subtitle">Brilliant move! You conquered the grid.</p>
        <div class="modal-actions">
          <button id="modal-play-again-btn" class="btn btn-primary btn-glow">
            <span>Play Again</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
